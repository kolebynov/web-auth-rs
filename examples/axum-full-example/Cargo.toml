[package]
name = "axum-full-example"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1.48", features = ["full"] }
web-auth-rs = { path = "../../", features = ["axum", "jwt"] }
